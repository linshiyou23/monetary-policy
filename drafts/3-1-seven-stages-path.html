<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>草稿 3-1：七个经济发展阶段路径图</title>
<style>
:root { --ink:#1f2328; --muted:#57606a; --line:#d8dee4; --accent:#0b5394; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 16px 64px;
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  color: var(--ink); background: #fbfbfa; line-height: 1.75;
}
main { max-width: 920px; margin: 0 auto; background:#fff; padding: 48px 56px 56px;
  border: 1px solid var(--line); border-radius: 8px; margin-top: 32px; }
h1, h2, h3, h4 { line-height: 1.4; color: #111; }
h1 { font-size: 1.7em; border-bottom: 2px solid var(--accent); padding-bottom: .4em; margin-top: .5em; }
h2 { font-size: 1.3em; border-bottom: 1px solid var(--line); padding-bottom: .3em; margin-top: 2em; }
h3 { font-size: 1.1em; margin-top: 1.6em; }
p, li { font-size: 15.5px; }
a { color: var(--accent); }
strong { color: #000; }
blockquote {
  margin: 1em 0; padding: 10px 18px; color: var(--muted);
  background: #f6f8fa; border-left: 4px solid var(--accent); border-radius: 0 6px 6px 0;
}
blockquote p { font-size: 14.5px; margin: .3em 0; }
table { border-collapse: collapse; width: 100%; margin: 1.2em 0; font-size: 14.5px; display: table; }
th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: #f2f5f8; font-weight: 600; white-space: nowrap; }
tr:nth-child(even) td { background: #fafbfc; }
hr { border: none; border-top: 1px solid var(--line); margin: 2.2em 0; }
code { background: #f2f5f8; border-radius: 4px; padding: 1px 5px; font-size: .92em;
  font-family: Consolas, "Courier New", monospace; }
footer { max-width: 920px; margin: 14px auto 0; color: var(--muted); font-size: 13px; text-align: center; }
@media print { body { background:#fff; padding:0; } main { border:none; padding:0; margin:0; max-width:none; } footer { display:none; } }
@media (max-width: 640px) { main { padding: 24px 16px; } table { display: block; overflow-x: auto; } }

/* 悬停批注（出处＋报告原文摘录）：句子与表格行共用气泡样式 */
.a { position: relative; cursor: help; }
.a-row { cursor: help; }
.a-row td:first-child { position: relative; }
.a > .pop, .a-row .pop { display: none; position: absolute; left: 0; top: calc(100% + 8px); z-index: 40;
  width: min(560px, 82vw); padding: 10px 14px; background: #fffdf3; border: 1px solid #d9c78f;
  border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); font-size: 13.5px; line-height: 1.8;
  color: #4a3f24; text-align: left; cursor: auto; }
.a:hover > .pop, .a:focus > .pop, .a-row:hover .pop, .a-row:focus .pop { display: block; }
.pop .src { color: var(--accent); font-weight: 600; }
.cite-badge { font-size: 13px; color: var(--muted); }

/* 政策更新（2022.7 后）：蓝色正文＋浅蓝双段气泡（原研报框架＋央行专栏摘录） */
.upd { color: #0b62c4; }
.upd strong { color: #054a9e; }
.a.upd > .pop, .upd > .pop { background: #f3f9ff; border-color: #a3c6e8; color: #16324f; }
.a.upd > .pop .src, .upd > .pop .src { color: #0b62c4; }

/* 学者观点补充（寇文红博士）：绿色正文＋浅绿气泡 */
.grn { color: #0a7d32; }
.grn strong { color: #07642a; }
.a.grn > .pop, .grn > .pop { background: #f2fbf5; border-color: #a5d6ad; color: #17401f; }
.a.grn > .pop .src, .grn > .pop .src { color: #0a7d32; }
/* 阶段与因果链总览：在正文宽度内保留一致的横向阅读顺序。 */
.stage-map, .chain-map { margin: 1.35em 0 1.7em; padding: 22px 24px 16px; background: #fff; border: 1px solid var(--line); border-top: 4px solid #177a73; line-height: 1.5; }
.stage-map h3, .chain-map h3 { margin: 0 0 4px; font-size: 18px; }
.stage-map__lead, .chain-map__lead { margin: 0 0 17px; color: var(--muted); font-size: 13px; }
.stage-map__head { display: grid; grid-template-columns: 1fr 18px 1fr 18px 1.12fr; gap: 8px; margin-left: 100px; padding: 0 8px 7px; border-bottom: 2px solid #26343a; color: var(--muted); font-size: 11px; font-weight: 700; }
.stage-map__row { padding: 10px 0; border-bottom: 1px solid var(--line); }
.stage-map__row:last-of-type { border-bottom: 0; }
.stage-map__row--update { background: #f3f8fc; margin: 0 -10px; padding: 10px; }
.stage-map__meta { display: grid; grid-template-columns: 100px 1fr; align-items: baseline; font-size: 12px; }
.stage-map__date { color: var(--muted); font-variant-numeric: tabular-nums; }
.stage-map__name { font-size: 13px; font-weight: 700; }
.stage-map__row--update .stage-map__name { color: #3f6fa6; }
.stage-map__path { display: grid; grid-template-columns: 1fr 18px 1fr 18px 1.12fr; gap: 8px; margin-left: 100px; align-items: center; font-size: 12px; }
.stage-map__cell { min-height: 36px; display: flex; align-items: center; padding: 4px 8px; border-left: 2px solid #cfded9; }
.stage-map__row--update .stage-map__cell { border-color: #c5d9ed; }
.stage-map__arrow, .chain-map__arrow { text-align: center; color: #85a19b; font-size: 18px; }
.stage-map figcaption, .chain-map figcaption { border-top: 1px solid var(--line); margin-top: 15px; padding-top: 9px; color: var(--muted); font-size: 12px; }
.chain-map__head, .chain-map__row { display: grid; grid-template-columns: 33px minmax(0,1fr) 18px minmax(0,1fr) 18px minmax(0,1fr); gap: 8px; align-items: center; }
.chain-map__head { padding-bottom: 7px; border-bottom: 2px solid #26343a; color: var(--muted); font-size: 11px; font-weight: 700; }
.chain-map__row { padding: 15px 0; border-bottom: 1px solid var(--line); }
.chain-map__number { color: #177a73; font-family: Georgia, serif; font-size: 23px; }
.chain-map__node { min-height: 86px; padding: 11px 10px; border-top: 3px solid var(--node); background: var(--bg); font-size: 12px; }
.chain-map__node strong { display: block; margin-bottom: 5px; font-size: 13px; }
.chain-map__update { display: grid; grid-template-columns: 100px 1fr; gap: 10px; margin-top: 16px; padding: 11px 13px; background: #edf4fa; border-left: 3px solid #3f6fa6; font-size: 12px; }
.chain-map__update strong { color: #3f6fa6; }
@media print { .a > .pop, .a-row .pop { display: none !important; } }
</style>
</head>
<body>
<main>
<figure class="stage-map" aria-labelledby="stage-map-title">
  <h3 id="stage-map-title">经济图景 → 金融结构 → 政策响应</h3>
  <p class="stage-map__lead">每行提炼最能解释框架变化的一组关系；具体事件和来源见下方各阶段正文。</p>
  <div class="stage-map__head" aria-hidden="true"><span>经济图景</span><span></span><span>金融结构</span><span></span><span>政策响应</span></div>
  <div class="stage-map__row"><div class="stage-map__meta"><span class="stage-map__date">1993—2000</span><strong class="stage-map__name">金融体制奠基</strong></div><div class="stage-map__path"><span class="stage-map__cell">专业银行商业化</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">政策性与商业性金融分离</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">政策性信贷与基础货币脱钩，央行报表定雏形</span></div></div>
  <div class="stage-map__row"><div class="stage-map__meta"><span class="stage-map__date">2001—2008</span><strong class="stage-map__name">出口驱动</strong></div><div class="stage-map__path"><span class="stage-map__cell">入世、双顺差</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">外汇占款被动投放</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">提准、央票回笼，防过热</span></div></div>
  <div class="stage-map__row"><div class="stage-map__meta"><span class="stage-map__date">2008—2013</span><strong class="stage-map__name">投资驱动</strong></div><div class="stage-map__path"><span class="stage-map__cell">危机刺激、地产基建</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">杠杆上升、影子银行起步</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">数量工具稳增长；钱荒暴露空转</span></div></div>
  <div class="stage-map__row"><div class="stage-map__meta"><span class="stage-map__date">2014—2016</span><strong class="stage-map__name">增速换挡</strong></div><div class="stage-map__path"><span class="stage-map__cell">经济放缓、外流压力</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">外汇占款拐点、同业扩张</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">央行工具主动投放，对冲下行</span></div></div>
  <div class="stage-map__row"><div class="stage-map__meta"><span class="stage-map__date">2017—2019</span><strong class="stage-map__name">去杠杆转型</strong></div><div class="stage-map__path"><span class="stage-map__cell">转向高质量发展</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">影子银行收缩、表外回表</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">宏观审慎成型、LPR 改革</span></div></div>
  <div class="stage-map__row"><div class="stage-map__meta"><span class="stage-map__date">2020—2022</span><strong class="stage-map__name">疫情与跨周期</strong></div><div class="stage-map__path"><span class="stage-map__cell">疫情冲击、三重压力</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">实体需求波动、居民行为变化</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">结构性工具直达，跨周期调节</span></div></div>
  <div class="stage-map__row stage-map__row--update"><div class="stage-map__meta"><span class="stage-map__date">2023—2026</span><strong class="stage-map__name">框架加速演进</strong></div><div class="stage-map__path"><span class="stage-map__cell">供强需弱、物价低位</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">直接融资上升、传统信贷需求偏弱</span><span class="stage-map__arrow">→</span><span class="stage-map__cell">2025 起适度宽松，利率框架重构</span></div></div>
  <figcaption><span class="a" tabindex="0">图 1｜前六行为 2022 年《流动性分析手册》归纳，蓝色行为 2023—2026 年更新。箭头是阶段内的解释路径，不表示单一原因。<span class="pop"><span class="src">出处：红塔证券《流动性分析手册》一至六；央行《中国货币政策执行报告》2024Q3、2025Q1、2026Q2 相关专栏</span><br>各阶段的具体事件、报告摘录与央行更新出处见下方总览表及分阶段正文批注。</span></span></figcaption>
</figure>
</main>
<script>
(function () {
  function place(el) {
    var pop = el.querySelector('.pop');
    if (!pop) return;
    pop.style.display = 'block';
    var pw = Math.min(560, innerWidth * 0.82);
    pop.style.position = 'fixed';
    pop.style.width = pw + 'px';
    var r = el.getBoundingClientRect(), ph = pop.offsetHeight;
    var top = r.bottom + 8;
    if (top + ph > innerHeight - 8) top = r.top - ph - 8;
    if (top < 8) top = 8;
    var left = r.left;
    if (left + pw > innerWidth - 8) left = innerWidth - 8 - pw;
    if (left < 8) left = 8;
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
  }
  function hide(el) {
    var pop = el.querySelector('.pop');
    if (!pop) return;
    pop.style.display = '';
    pop.style.position = '';
  }
  document.querySelectorAll('.a, .a-row').forEach(function (el) {
    el.addEventListener('mouseenter', function () { place(el); });
    el.addEventListener('focus', function () { place(el); });
    el.addEventListener('mouseleave', function () { hide(el); });
    el.addEventListener('blur', function () { hide(el); });
  });
})();
</script>
</body>
</html>
